name: anansiflow-local-test

x-app: &app
  image: anansiflow:local
  env_file:
    - .env.anansiflow.production.local
  environment:
    RAILS_ENV: production
    NODE_ENV: production
    RAILS_SERVE_STATIC_FILES: "true"
    INSTALLATION_ENV: docker
    FRONTEND_URL: http://localhost:9001
    FORCE_SSL: "false"
    ENABLE_ACCOUNT_SIGNUP: "false"
    ACTIVE_STORAGE_SERVICE: local
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USERNAME: postgres
    POSTGRES_DATABASE: chatwoot
    REDIS_URL: redis://redis:6379
    SMTP_ADDRESS: mailpit
    SMTP_PORT: "1025"
    SMTP_ENABLE_STARTTLS_AUTO: "false"
    IP_LOOKUP_API_KEY: ""
  volumes:
    - storage:/app/storage
  networks:
    - isolated
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  rails:
    <<: *app
    entrypoint: ["/app/docker/entrypoints/rails.sh"]
    command: ["bundle", "exec", "rails", "server", "-p", "3000", "-b", "0.0.0.0"]

  proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:9001:8080"
      - "127.0.0.1:9002:8082"
    volumes:
      - ./docker/local-test-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - isolated
      - local_access
    depends_on:
      rails:
        condition: service_started
      mailpit:
        condition: service_started

  sidekiq:
    <<: *app
    profiles: ["workers"]
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  mailpit:
    image: public.ecr.aws/supabase/mailpit@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    networks:
      - isolated

  postgres:
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - isolated
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatwoot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD using the local secrets file}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'printf "requirepass %s\nappendonly yes\n" "$$REDIS_PASSWORD" | exec redis-server -'
    volumes:
      - redis:/data
    networks:
      - isolated
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q '^PONG$$'"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  isolated:
    internal: true
  local_access:

volumes:
  postgres:
    external: true
    name: anansiflow_credcheck_pg_20261111
  redis:
  storage:
